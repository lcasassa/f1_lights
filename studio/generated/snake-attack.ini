; Generated by f1_lights studio for "Snake attack".
; Rebuilt whenever the game is regenerated — do not hand-edit.
[env:studio-snake-attack]
extends = env:esp32-c3-screen
build_flags =
    ${env:esp32-c3-screen.build_flags}
    -DSCREEN_GAME_CUSTOM=1
    -DSCREEN_CUSTOM_GAME_HEADER='"studio/games/snake-attack/game.h"'
    -DSCREEN_CUSTOM_GAME_NAME='"snake-attack"'
    -DSCREEN_REMOTE_CONTROL=1
    -I$PROJECT_DIR

[env:studio-snake-attack-ota]
extends = env:studio-snake-attack
upload_protocol = espota
upload_port = f1-screen.local
upload_flags =
    --auth=f1ota
    --port=3232
